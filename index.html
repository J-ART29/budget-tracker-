<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header class="page-header">
            <p class="eyebrow">Personal Finance</p>
            <h1>Budget Tracker</h1>
            <p>Track your spending and stay in control of your money.</p>
        </header>

        <section aria-labelledby="add-expense-heading">
            <form id="expense-form">
                <h2 id="add-expense-heading">Add Expense</h2>
                <label for="expense-name">Expense name</label>
                <input id="expense-name" name="expense-name" type="text" placeholder="e.g. Groceries" required>

                <label for="expense-amount">Amount (KES)</label>
                <input id="expense-amount" name="expense-amount" type="number" min="0.01" step="0.01" placeholder="e.g. 1500" required>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="table-container" aria-labelledby="expense-table-heading">
            <h2 id="expense-table-heading">Expense Table</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Expense</th>
                        <th scope="col">Amount</th>
                    </tr>
                </thead>
                <tbody id="expense-list">
                    <tr>
                        <td>Groceries</td>
                        <td>KES 1,500</td>
                    </tr>
                    <tr>
                        <td>Transport</td>
                        <td>KES 300</td>
                    </tr>
                    <tr>
                        <td>food</td>
                        <td>KES 150</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
